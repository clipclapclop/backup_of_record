name: Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: backup-of-record-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - name: Check release signing secrets
        if: ${{ env.HAS_RELEASE_SIGNING != 'true' }}
        run: |
          echo "Skipping signed release APK: Android signing secrets are not configured."
          exit 0

      - name: Check out repository
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Java
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: flutter pub get

      - name: Restore Android signing files
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/android-signing/release.keystore"
          } > android/key.properties

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk backup-of-record-android-arm64.apk
          sha256sum backup-of-record-android-arm64.apk > backup-of-record-android-arm64.apk.sha256

      - name: Upload signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-of-record-release-apk
          path: |
            backup-of-record-android-arm64.apk
            backup-of-record-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backup-of-record-android-arm64.apk
            backup-of-record-android-arm64.apk.sha256
          generate_release_notes: true
